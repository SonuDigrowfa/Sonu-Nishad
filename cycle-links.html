<!DOCTYPE html>
<html>
<head>
  <title>Cycle Through Links</title>
</head>
<body>

<a href="#" id="cycleLink">Click me</a>

<script>
  // List of URLs to cycle through
  const urls = [
    "https://mygsm24.com/",
    "https://gsmradix.com/",
    "https://gsmcradle.com/"
  ];

  // Start at a random index on each page load
  let clickCount = Math.floor(Math.random() * urls.length);

  // Optional: update the visible href on the page (not required)
  const link = document.getElementById("cycleLink");
  link.href = urls[clickCount % urls.length];

  link.addEventListener("click", function (e) {
    e.preventDefault();

    const currentUrl = urls[clickCount % urls.length];

    // Open in a new tab
    window.open(currentUrl, '_blank');

    // Go to next link in the cycle
    clickCount++;
  });
</script>

</body>
</html>
